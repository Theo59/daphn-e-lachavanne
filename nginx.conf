worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml;

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # TLS terminé par Traefik : émettre des Location relatifs pour ne jamais
    # rediriger vers http:// en dur.
    absolute_redirect off;

    # En-têtes de sécurité sur toutes les pages (ex-netlify.toml)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Routes serveur (contact, newsletter → Brevo) : seules requêtes routées vers Node.
    location /api/ {
      proxy_pass http://127.0.0.1:4321;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Studio Sanity (SPA client-side) : /admin et toutes ses sous-routes servent admin.html.
    location /admin {
      try_files $uri $uri.html /admin.html =404;
    }

    # Cache long terme pour les assets Astro (hachés)
    location /_astro/ {
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(js|css|woff2?)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # Cache médias
    location /media/ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
      expires 30d;
      add_header Cache-Control "public";
    }

    # Pages Astro (build.format 'file' : /en → en.html, /en/soins → en/soins.html).
    # $uri.html AVANT $uri/ : sinon /en matche le dossier en/ (sous-pages EN),
    # nginx 301 vers /en/ qui n'a pas d'index.html → 403.
    # Le rewrite canonise les URLs à slash final (/en/ → /en) pour la même raison.
    location / {
      rewrite ^/(.+)/$ /$1 permanent;
      try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
  }
}

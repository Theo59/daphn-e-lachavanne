[build]
  # Build, puis retrait du déploiement des médias lourds NON utilisés par le site
  # (originaux conservés dans le repo ; évite d'expédier ~200 Mo et l'expo publique du PDF charte).
  command = "npm run build && rm -f dist/media/TRANSE_RETOUCHE.mov dist/media/yoga-childpose.jpg dist/media/yoga-bow.jpg dist/media/charte-daphne-lachavanne.pdf dist/media/fond-1.png dist/media/logo_noir.eps"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Studio Sanity (SPA client-side) : toutes les sous-routes /admin/* servent la page /admin.
# Le site public reste statique ; seul ce rewrite est nécessaire (pas d'adaptateur serveur).
[[redirects]]
  from = "/admin/*"
  to = "/admin"
  status = 200

# Cache long terme pour les assets Astro (hachés)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache médias
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# En-têtes de sécurité sur toutes les pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[build]
  # Les originaux lourds vivent dans media-src/ (hors public/ → non déployés) ;
  # seules les variantes optimisées public/media/web/ partent en prod.
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # PUBLIC_SANITY_PROJECT_ID / _DATASET sont des identifiants PUBLICS (présents par
  # design dans le bundle client du Studio) — pas des secrets. On les exclut du
  # scanner de secrets Netlify, sinon le build échoue (« Exposed secrets detected »).
  SECRETS_SCAN_OMIT_KEYS = "PUBLIC_SANITY_PROJECT_ID,PUBLIC_SANITY_DATASET"

# Studio Sanity (SPA client-side) : toutes les sous-routes /admin/* servent la page /admin.
# Le site public reste statique ; seul ce rewrite est nécessaire (pas d'adaptateur serveur).
[[redirects]]
  from = "/admin/*"
  to = "/admin"
  status = 200

# Cache long terme pour les assets Astro (hachés)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache médias
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# En-têtes de sécurité sur toutes les pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

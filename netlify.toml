[build]
  # Site statique Astro ; images servies par le CDN Sanity (rien de lourd dans public/).
  command = "npm run build"
  publish = "dist"

# Fonctions serverless (ex. inscription newsletter → Brevo).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"
  # PUBLIC_SANITY_PROJECT_ID / _DATASET sont des identifiants PUBLICS (présents par
  # design dans le bundle client du Studio) — pas des secrets. On les exclut du
  # scanner de secrets Netlify, sinon le build échoue (« Exposed secrets detected »).
  SECRETS_SCAN_OMIT_KEYS = "PUBLIC_SANITY_PROJECT_ID,PUBLIC_SANITY_DATASET"

# Studio Sanity (SPA client-side) : toutes les sous-routes /admin/* servent la page /admin.
# Le site public reste statique ; seul ce rewrite est nécessaire (pas d'adaptateur serveur).
[[redirects]]
  from = "/admin/*"
  to = "/admin"
  status = 200

# Cache long terme pour les assets Astro (hachés)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache médias
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# En-têtes de sécurité sur toutes les pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # HSTS (hygiène). Sans 'preload' (engagement quasi-irréversible avant soumission à hstspreload.org).
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
